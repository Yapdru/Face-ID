<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a90ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0a84ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0078d4;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="grad2" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#30d158;stop-opacity:0.3;"/>
      <stop offset="100%" style="stop-color:#0a84ff;stop-opacity:0.1;"/>
    </radialGradient>
  </defs>

  <!-- Base gradient background -->
  <rect width="512" height="512" fill="url(#grad1)"/>

  <!-- Subtle glow overlay -->
  <circle cx="256" cy="256" r="280" fill="url(#grad2)"/>

  <!-- Face ID Icon Group -->
  <g transform="translate(256, 256)">
    <!-- Top left bracket -->
    <line x1="-85" y1="-95" x2="-45" y2="-95" stroke="white" stroke-width="16" stroke-linecap="round"/>
    <line x1="-95" y1="-85" x2="-95" y2="-45" stroke="white" stroke-width="16" stroke-linecap="round"/>

    <!-- Top right bracket -->
    <line x1="85" y1="-95" x2="45" y2="-95" stroke="white" stroke-width="16" stroke-linecap="round"/>
    <line x1="95" y1="-85" x2="95" y2="-45" stroke="white" stroke-width="16" stroke-linecap="round"/>

    <!-- Bottom left bracket -->
    <line x1="-85" y1="95" x2="-45" y2="95" stroke="white" stroke-width="16" stroke-linecap="round"/>
    <line x1="-95" y1="85" x2="-95" y2="45" stroke="white" stroke-width="16" stroke-linecap="round"/>

    <!-- Bottom right bracket -->
    <line x1="85" y1="95" x2="45" y2="95" stroke="white" stroke-width="16" stroke-linecap="round"/>
    <line x1="95" y1="85" x2="95" y2="45" stroke="white" stroke-width="16" stroke-linecap="round"/>

    <!-- Face outline (head) -->
    <circle cx="0" cy="-15" r="38" fill="none" stroke="white" stroke-width="14"/>

    <!-- Face body -->
    <path d="M -35 25 Q 0 50 35 25 L 35 45 Q 0 70 -35 45 Z" fill="white" opacity="0.95"/>

    <!-- Glow effect on face -->
    <circle cx="0" cy="-15" r="42" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="-15" r="45" fill="none" stroke="white" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- Subtle corner accents -->
  <circle cx="50" cy="50" r="4" fill="white" opacity="0.3"/>
  <circle cx="462" cy="50" r="4" fill="white" opacity="0.3"/>
  <circle cx="50" cy="462" r="4" fill="white" opacity="0.3"/>
  <circle cx="462" cy="462" r="4" fill="white" opacity="0.3"/>
</svg>
