<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium gradient -->
    <linearGradient id="premiumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a94ff;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#0a84ff;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#0078e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0060d0;stop-opacity:1" />
    </linearGradient>

    <!-- Subtle radial glow for depth -->
    <radialGradient id="glowEffect" cx="40%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15;"/>
      <stop offset="70%" style="stop-color:#ffffff;stop-opacity:0.03;"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.1;"/>
    </radialGradient>

    <!-- Top highlight -->
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2;"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.08;"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0;"/>
    </linearGradient>

    <!-- Bottom shadow -->
    <linearGradient id="bottomShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0;"/>
      <stop offset="50%" style="stop-color:#000000;stop-opacity:0.08;"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15;"/>
    </linearGradient>

    <!-- Accent glow colors -->
    <linearGradient id="accentGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#30d158;stop-opacity:0.25;"/>
      <stop offset="50%" style="stop-color:#0a84ff;stop-opacity:0.15;"/>
      <stop offset="100%" style="stop-color:#bf5af2;stop-opacity:0.2;"/>
    </linearGradient>
  </defs>

  <!-- Base gradient background -->
  <rect width="512" height="512" fill="url(#premiumGrad)"/>

  <!-- Depth glow overlay -->
  <circle cx="256" cy="256" r="300" fill="url(#glowEffect)"/>

  <!-- Accent gradient overlay for premium feel -->
  <rect width="512" height="512" fill="url(#accentGlow)" opacity="0.4"/>

  <!-- Top highlight for glass effect -->
  <ellipse cx="256" cy="100" rx="200" ry="120" fill="url(#topHighlight)"/>

  <!-- Bottom shadow for depth -->
  <ellipse cx="256" cy="420" rx="220" ry="100" fill="url(#bottomShadow)"/>

  <!-- Face ID Icon Group -->
  <g transform="translate(256, 256)">
    <!-- Outer glow ring (subtle) -->
    <circle cx="0" cy="0" r="165" fill="none" stroke="white" stroke-width="1" opacity="0.15"/>

    <!-- Corner brackets with rounded ends -->
    <!-- Top left bracket outer -->
    <path d="M -90 -105 L -50 -105 M -105 -90 L -105 -50"
          stroke="white" stroke-width="18" stroke-linecap="round" fill="none" opacity="1"/>
    <!-- Top left bracket inner glow -->
    <path d="M -90 -105 L -50 -105 M -105 -90 L -105 -50"
          stroke="white" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.2" filter="blur(2px)"/>

    <!-- Top right bracket -->
    <path d="M 90 -105 L 50 -105 M 105 -90 L 105 -50"
          stroke="white" stroke-width="18" stroke-linecap="round" fill="none" opacity="1"/>
    <path d="M 90 -105 L 50 -105 M 105 -90 L 105 -50"
          stroke="white" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.2" filter="blur(2px)"/>

    <!-- Bottom left bracket -->
    <path d="M -90 105 L -50 105 M -105 90 L -105 50"
          stroke="white" stroke-width="18" stroke-linecap="round" fill="none" opacity="1"/>
    <path d="M -90 105 L -50 105 M -105 90 L -105 50"
          stroke="white" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.2" filter="blur(2px)"/>

    <!-- Bottom right bracket -->
    <path d="M 90 105 L 50 105 M 105 90 L 105 50"
          stroke="white" stroke-width="18" stroke-linecap="round" fill="none" opacity="1"/>
    <path d="M 90 105 L 50 105 M 105 90 L 105 50"
          stroke="white" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.2" filter="blur(2px)"/>

    <!-- Face: Head Circle -->
    <circle cx="0" cy="-22" r="42" fill="none" stroke="white" stroke-width="16"/>
    <!-- Head glow -->
    <circle cx="0" cy="-22" r="44" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
    <circle cx="0" cy="-22" r="46" fill="none" stroke="white" stroke-width="1" opacity="0.15"/>

    <!-- Face: Body (shoulders) -->
    <path d="M -38 28 Q 0 58 38 28 L 36 52 Q 0 78 -36 52 Z"
          fill="white" stroke="white" stroke-width="12" stroke-linejoin="round" opacity="0.95"/>

    <!-- Body glow effect -->
    <ellipse cx="0" cy="45" rx="48" ry="22" fill="white" opacity="0.12" filter="blur(4px)"/>

    <!-- Center accent dot (nose area) -->
    <circle cx="0" cy="0" r="6" fill="white" opacity="0.4"/>

    <!-- Subtle inner light on face -->
    <circle cx="-8" cy="-28" r="6" fill="white" opacity="0.25" filter="blur(2px)"/>
  </g>

  <!-- Corner accent dots for premium feel -->
  <circle cx="40" cy="40" r="5" fill="white" opacity="0.35"/>
  <circle cx="472" cy="40" r="5" fill="white" opacity="0.35"/>
  <circle cx="40" cy="472" r="5" fill="white" opacity="0.35"/>
  <circle cx="472" cy="472" r="5" fill="white" opacity="0.35"/>

  <!-- Subtle edge lighting -->
  <circle cx="0" cy="0" r="256" fill="none" stroke="white" stroke-width="1" opacity="0.08"/>
</svg>
