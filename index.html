:1}}.error-shake{animation:errorShake .4s ease}@keyframes errorShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}</style></head><body><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div><div class="sun" id="sun" role="button" aria-label="Menu" aria-expanded="false">☀️</div><div class="menu" id="menu" role="menu"><div class="menu-label">Biometrics</div><button class="menu-item" role="menuitem" onclick="touchID()">🫆 Touch ID</button><button class="menu-item" role="menuitem" onclick="passcode()">🔢 Passcode</button><div class="divider"></div><div class="menu-label">Data</div><button class="menu-item" role="menuitem" onclick="exp()">📤 Export</button><button class="menu-item" role="menuitem" onclick="imp()">📥 Import</button><div class="divider"></div><button class="menu-item" role="menuitem" onclick="clear()">🗑️ Clear</button></div><div id="touchModal" class="modal" role="dialog"><div class="box"><div class="touch-icon">🫆</div><h2>Touch ID</h2><p id="touchMsg"></p><div class="buttons"><button class="btn-sec" onclick="close_m()">Cancel</button><button onclick="do_touch()">Authenticate</button></div></div></div><div id="passModal" class="modal" role="dialog"><div class="box"><h2>🔢 Passcode</h2><p id="passMsg"></p><div class="pins" id="pins"></div><div class="grid-pin" id="grid"></div><button class="btn-sec" onclick="close_m()">Cancel</button></div></div><div id="expModal" class="modal" role="dialog"><div class="box"><h2>📤 Export</h2><p>Share this code</p><div class="code" id="code"></div><div class="buttons"><button class="btn-sec" onclick="close_m()">Close</button><button class="btn-ok" onclick="copy_code()">📋 Copy</button></div></div></div><div id="impModal" class="modal" role="dialog"><div class="box"><h2>📥 Import</h2><p>Paste code</p><textarea id="impInput" placeholder="Paste here…"></textarea><div class="buttons" style="margin-top:12px"><button class="btn-sec" onclick="close_m()">Cancel</button><button class="btn-ok" onclick="do_imp()">Import</button></div></div></div><div class="card"><div class="logo">🔐</div><h1>Face ID</h1><p class="subtitle">Premium Auth</p><p id="msg">Ready</p><div class="content"><div id="start"><button id="btn" onclick="start()" style="font-size:1.05rem;padding:14px">📷 Scan</button></div><div id="main" class="hidden"><div id="video"><button class="flip" onclick="flip()" aria-label="Flip">📱</button><video id="cam" autoplay playsinline muted></video><canvas id="cnv"></canvas><div class="guide"><div class="circle" id="circ"><div style="position:absolute;inset:0;border-radius:50%"><div class="dot" id="d0" style="top:0%;left:50%;transform:translate(-50%,-50%)"></div><div class="dot" id="d1" style="top:50%;right:0%;transform:translate(50%,-50%)"></div><div class="dot" id="d2" style="bottom:0%;left:50%;transform:translate(-50%,50%)"></div><div class="dot" id="d3" style="top:50%;left:0%;transform:translate(-50%,-50%)"></div></div><div class="arrow arrow-u">↑</div><div class="arrow arrow-d">↓</div><div class="arrow arrow-l">←</div><div class="arrow arrow-r">→</div></div></div><div class="ring" id="ring"><div style="width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.38);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center"><svg class="ring" viewBox="0 0 50 50"><circle id="prog" cx="25" cy="25" r="22"/></svg><span id="pct" style="position:absolute;font-size:.7rem;color:white;font-weight:700;text-shadow:0 0 6px rgba(0,0,0,.8)">0%</span></div></div></div><div class="controls"><div id="form"><div id="users" class="hidden"><div class="users"><div class="users-label">👥 Enrolled</div><div class="users-grid" id="ulist"></div></div></div><input type="text" id="name" placeholder="Your name" autocomplete="off"/><button onclick="enroll()">👤 Enroll</button><button onclick="login()">🔓 Login</button></div><div id="enroll" class="hidden"><div class="progress"><div id="bar"></div></div><div id="status"><span>Scanning…</span><span id="num">0%</span></div></div><div id="success" class="hidden"><div class="icon">✓</div><p id="succeed"></p><button onclick="back()">← Back</button></div><div id="lgn" class="hidden"><div class="conf"><span class="conf-label">Match:</span><div class="conf-bar"><div class="conf-fill" id="conf"></div></div><span id="conf-num">0%</span></div></div></div></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script><script>let v,c,x,u={},n='',m='idle',e=0,d=0,cam='user',lr=null,rc=0,rid=null,ldt=0,pin='',ent='',pmode='check',wa=null,qc=0,ang={},blink=0,prevEyes=1,failCnt=0,sessTm=null;const INT=150,FAIL_MAX=5,SESS_TMO=30*60*1e3;window.addEventListener('DOMContentLoaded',()=>{u=JSON.parse(localStorage.getItem('u')||'{}');pin=localStorage.getItem('p')||'';const w=localStorage.getItem('w');if(w)wa=w;upd();pins();document.addEventListener('keydown',e=>{if(e.key==='Escape'){close_m();close_m()};if(e.key==='e'&&(e.metaKey||e.ctrlKey)){e.preventDefault();exp()}if(e.key==='i'&&(e.metaKey||e.ctrlKey)){e.preventDefault();imp()}});document.addEventListener('click',e=>{if(!e.target.closest('#sun')&&!e.target.closest('#menu'))close_m()})});function toggle_m(){const o=document.getElementById('menu').classList.contains('open');const b=document.getElementById('sun');if(o){close_m()}else{document.getElementById('menu').classList.add('open');b.classList.add('open');b.setAttribute('aria-expanded','true')}}function close_m(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open'));document.getElementById('menu').classList.remove('open');document.getElementById('sun').classList.remove('open');document.getElementById('sun').setAttribute('aria-expanded','false');ent='';upd_pin()}function touchID(){document.getElementById('touchMsg').textContent=wa?'Authenticate':'Register';open_m('touchModal')}async function do_touch(){if(!window.PublicKeyCredential){document.getElementById('touchMsg').textContent='❌ Not supported';return}try{if(!wa){document.getElementById('touchMsg').textContent='⏳ Registering…';const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Face ID',id:location.hostname||'localhost'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'user',displayName:'User'},pubKeyCredParams:[{alg:-7,type:'public-key'},{alg:-257,type:'public-key'}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});wa=btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));localStorage.setItem('w',wa);document.getElementById('touchMsg').textContent='✓ Done!';setTimeout(close_m,1200)}else{document.getElementById('touchMsg').textContent='⏳ Verifying…';const rid=Uint8Array.from(atob(wa),c=>c.charCodeAt(0));await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{id:rid,type:'public-key'}],userVerification:'required',timeout:60000}});document.getElementById('touchMsg').textContent='✓ Success!';setTimeout(()=>{close_m();show_ok('Touch ID! 🫆')},'700')}}catch(e){document.getElementById('touchMsg').textContent='❌ Failed'}}function passcode(){ent='';pmode=pin?'check':'set';document.getElementById('passMsg').textContent=pmode==='set'?'Create 6-digit PIN':'Enter PIN';upd_pin();open_m('passModal')}function pins(){document.getElementById('pins').innerHTML=Array(6).fill('<div class="dot-pin"></div>').join('');const k=['1','2','3','4','5','6','7','8','9','⌫','0','✓'];document.getElementById('grid').innerHTML=k.map(i=>`<div class="pin-wrap"><button class="pin${i==='⌫'?' del':''}${i==='✓'?' ok':''}" onclick="key('${i}')">${i}</button></div>`).join('')}function key(k){if(k==='⌫')ent=ent.slice(0,-1);else if(k==='✓'){sub_pin();return}else if(ent.length<6)ent+=k;upd_pin();if(ent.length===6&&pmode==='check')sub_pin()}function upd_pin(){document.querySelectorAll('.dot-pin').forEach((d,i)=>d.classList.toggle('fill',i<ent.length))}function sub_pin(){if(pmode==='set'){if(ent.length<4){shake();document.getElementById('passMsg').textContent='❌ Min 4 digits';spk('Passcode must be at least 4 digits');return}pin=ent;localStorage.setItem('p',pin);document.getElementById('passMsg').textContent='✓ Passcode saved!';spk('Passcode created');setTimeout(close_m,800)}else{if(ent===pin){document.getElementById('passMsg').textContent='✓ Correct!';spk('Passcode verified');setTimeout(()=>{close_m();show_ok('Verified! 🔢')},'500')}else{ent='';upd_pin();shake();failCnt++;document.getElementById('passMsg').textContent=`❌ Wrong (${FAIL_MAX-failCnt} left)`;if(failCnt>=FAIL_MAX)setTimeout(()=>{close_m();set_msg('🔒 Locked')},1200);spk('Incorrect passcode')}}}function shake(){const d=document.getElementById('pins');d.style.animation='none';void d.offsetHeight;d.style.animation='shake .4s ease'}function exp(){const names=Object.keys(u);document.getElementById('code').textContent=names.length?btoa(unescape(encodeURIComponent(JSON.stringify(u)))):'No data';open_m('expModal')}function imp(){document.getElementById('impInput').value='';open_m('impModal')}function copy_code(){const code=document.getElementById('code').textContent;navigator.clipboard.writeText(code).then(()=>{const b=event.currentTarget;b.textContent='✓ Done!';setTimeout(()=>{b.textContent='📋 Copy'},1500)}).catch(()=>alert('Failed'))}function do_imp(){const raw=document.getElementById('impInput').value.trim();try{const data=JSON.parse(decodeURIComponent(escape(atob(raw))));const cnt=Object.keys(data).length;if(!cnt)throw new Error('empty');Object.assign(u,data);save();close_m();alert(`✓ ${cnt} faces!`)}catch{alert('❌ Bad code')}}function clear(){if(confirm('Delete all?')){u={};pin='';wa=null;localStorage.clear();upd();close_m();alert('✓ Cleared')}}function upd(){const names=Object.keys(u);const sec=document.getElementById('users');if(!names.length){sec.classList.add('hidden');return}sec.classList.remove('hidden');document.getElementById('ulist').innerHTML=names.map(n=>`<div class="chip" onclick="quick('${n}')">👤 ${n}<button class="del" onclick="del_u('${n}',event)">×</button></div>`).join('')}function save(){localStorage.setItem('u',JSON.stringify(u));upd()}function del_u(name,e){e.stopPropagation();if(confirm(`Delete ${name}?`)){delete u[name];save()}}function quick(name){document.getElementById('name').value=name;login()}async function start(){document.getElementById('start').innerHTML='';set_msg('🎥 Requesting…');try{const st=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:cam},audio:false});v=document.getElementById('cam');c=document.getElementById('cnv');x=c.getContext('2d',{willReadFrequently:false,alpha:true});v.srcObject=st;document.getElementById('video').style.display='block';document.getElementById('main').classList.remove('hidden');v.onloadedmetadata=()=>{c.width=v.videoWidth;c.height=v.videoHeight;c.style.width='100%';c.style.height='100%';load_mod()}}catch(e){set_msg('❌ Denied')}}async function flip(){if(rid){cancelAnimationFrame(rid);rid=null}d=0;if(v&&v.srcObject)v.srcObject.getTracks().forEach(t=>t.stop());cam=cam==='user'?'environment':'user';set_msg('🔄 Switching…');await start()}async function load_mod(){try{set_msg('⚙️ Loading…');const URL='https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(URL),faceapi.nets.faceLandmark68Net.loadFromUri(URL),faceapi.nets.faceRecognitionNet.loadFromUri(URL)]);set_msg('✓ Ready');d=1;rid=requestAnimationFrame(loop)}catch(e){set_msg('❌ Failed')}}function loop(ts){if(!d)return;if(ts-ldt>=INT){ldt=ts;detect()}rid=requestAnimationFrame(loop)}async function detect(){if(!v||v.readyState<2)return;try{const dets=await faceapi.detectAllFaces(v,new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.5})).withFaceLandmarks().withFaceDescriptors();x.clearRect(0,0,c.width,c.height);if(!dets.length){document.getElementById('circ').classList.remove('ok','warn');document.querySelectorAll('.arrow').forEach(a=>a.classList.remove('show'));lr=null;rc=0;prevEyes=1;return}const displaySize={width:v.videoWidth,height:v.videoHeight};faceapi.matchDimensions(c,displaySize);const resized=faceapi.resizeResults(dets,displaySize);faceapi.draw.drawDetections(c,resized);faceapi.draw.drawFaceLandmarks(c,resized);const {descriptor,landmarks}=dets[0];chk_blink(landmarks);fb(landmarks);if(m==='enroll'){const nose=landmarks.getNose()[3];const cx=c.width/2,cy=c.height/2;const dx=nose.x-cx,dy=nose.y-cy;const dist=Math.sqrt(dx*dx+dy*dy);const opt=60;if(dist<=opt){qc++;if(qc>=2){e++;const ang_val=Math.round(Math.atan2(dy,dx)*180/Math.PI/90)*90;const akey=(ang_val+360)%360;ang[akey]=true;upd_ang()}}else{qc=0}const p=Math.min(100,Math.floor(e/15*100));document.getElementById('bar').style.width=p+'%';document.getElementById('num').textContent=p+'%';document.getElementById('pct').textContent=p+'%';const circ=document.getElementById('prog');if(circ)circ.style.strokeDashoffset=138*(1-p/100);if(e>=15&&blink>0){u[n]={descriptor:Array.from(descriptor),enrolled:new Date().toISOString(),angles:Object.keys(ang),liveness:blink};save();m='idle';qc=0;ang={};blink=0;show_ok(`${n} enrolled! 👤`)}else if(e>=15&&blink===0){set_msg('⚠️ Blink to confirm')}}else if(m==='login'&&failCnt<FAIL_MAX){let best={name:null,dist:Infinity};for(const [name,data]of Object.entries(u)){const d=faceapi.euclideanDistance(descriptor,data.descriptor);if(d<best.dist)best={name,dist:d}}const conf=Math.max(0,Math.min(100,100-(best.dist*50)));document.getElementById('conf').style.width=conf+'%';document.getElementById('conf-num').textContent=Math.round(conf)+'%';if(best.dist<.6&&blink>1){if(lr===best.name)rc++;else{lr=best.name;rc=1;blink=0}if(rc>=3){m='idle';show_ok(`Welcome ${best.name}! 🎉`);lr=null;rc=0;failCnt=0;blink=0}}else{if(best.dist>=.6||blink<1)lr=null;rc=0}}else if(m==='login'&&failCnt>=FAIL_MAX){document.getElementById('lgn').classList.add('hidden')}}catch(e){console.error(e)}}function upd_ang(){const angs=[0,90,180,270];angs.forEach(a=>{const el=document.getElementById(`d${a/90}`);if(ang[a])el.classList.add('on');else el.classList.remove('on')})}function chk_blink(landmarks){const leftEye=landmarks.getLeftEye();const rightEye=landmarks.getRightEye();const eyeOpennessL=Math.hypot(leftEye[1].y-leftEye[4].y,leftEye[1].x-leftEye[4].x);const eyeOpennessR=Math.hypot(rightEye[1].y-rightEye[4].y,rightEye[1].x-rightEye[4].x);const currEyes=eyeOpennessL+eyeOpennessR;const ratio=currEyes/Math.max(prevEyes,.1);if(ratio<.5)blink++;prevEyes=currEyes}function check_fail(){if(failCnt>=FAIL_MAX){set_msg('⏳ Locked (30s)');m='locked';setTimeout(()=>{failCnt=0;m='idle';set_msg('Ready')},SESS_TMO)}}function log_fail(){failCnt++;check_fail()}function spk(text){if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance(text);u.rate=1.1;u.pitch=1;u.volume=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}}function fb(landmarks){const circ=document.getElementById('circ');const nose=landmarks.getNose()[3];const cx=c.width/2,cy=c.height/2;const dx=nose.x-cx,dy=nose.y-cy;const dist=Math.sqrt(dx*dx+dy*dy);const opt=60;const warn=120;let qual='bad';let msg='';if(dist>warn){qual='bad'}else if(dist>opt){qual='warn'}else{qual='ok'}const thr=50;document.querySelectorAll('.arrow').forEach(a=>a.classList.remove('show'));if(Math.abs(dy)>thr){if(dy<-thr){document.querySelector('.arrow-u').classList.add('show');msg='↑ Down'}else{document.querySelector('.arrow-d').classList.add('show');msg='↓ Up'}}if(Math.abs(dx)>thr){if(dx<-thr){document.querySelector('.arrow-l').classList.add('show');msg='← Right'}else{document.querySelector('.arrow-r').classList.add('show');msg='→ Left'}}if(dist<=opt){circ.classList.add('ok');circ.classList.remove('warn');set_msg('✓ Perfect!');msg=''}else if(dist<=warn){circ.classList.add('warn');circ.classList.remove('ok');if(!msg)msg='Adjust';set_msg('🟡 '+msg)}else{circ.classList.remove('ok','warn');if(!msg)msg='Too far';set_msg('🔴 '+msg)}circ.style.borderColor=qual==='ok'?'rgba(16,185,129,.9)':qual==='warn'?'rgba(248,113,113,.7)':'rgba(239,68,68,.6)';if(qual==='ok'){circ.style.boxShadow='0 0 30px rgba(16,185,129,.5), inset 0 0 20px rgba(16,185,129,.15)'}else if(qual==='warn'){circ.style.boxShadow='0 0 25px rgba(248,113,113,.35), inset 0 0 15px rgba(248,113,113,.1)'}else{circ.style.boxShadow='0 0 20px rgba(239,68,68,.25)'}}function enroll(){n=document.getElementById('name').value.trim();if(!n){shake();set_msg('❌ Enter name');return}if(u[n]){if(!confirm(`Re-enroll ${n}?`))return}m='enroll';e=0;qc=0;blink=0;ang={};document.getElementById('form').classList.add('hidden');document.getElementById('enroll').classList.remove('hidden');document.getElementById('ring').style.display='block';upd_ang();set_msg('📍 Center face in circle');spk('Center your face and hold steady')}function login(){if(failCnt>=FAIL_MAX){set_msg('⏳ Too many attempts (30s)');return}m='login';blink=0;document.getElementById('form').classList.add('hidden');document.getElementById('lgn').classList.remove('hidden');set_msg('👁️ Point face & blink');spk('Look at the camera and blink to authenticate')}function show_ok(msg){document.getElementById('form').classList.add('hidden');document.getElementById('enroll').classList.add('hidden');document.getElementById('lgn').classList.add('hidden');document.getElementById('success').classList.remove('hidden');document.getElementById('succeed').textContent='✓ '+msg;document.getElementById('ring').style.display='none';spk(msg.includes('Welcome')?'Authentication successful':'Enrollment complete')}function back(){n='';m='idle';e=0;qc=0;blink=0;ang={};document.getElementById('name').value='';document.getElementById('form').classList.remove('hidden');document.getElementById('enroll').classList.add('hidden');document.getElementById('lgn').classList.add('hidden');document.getElementById('success').classList.add('hidden');document.getElementById('ring').style.display='none';set_msg('Ready');speechSynthesis.cancel()}function set_msg(text){document.getElementById('msg').textContent=text}function open_m(id){close_m();document.getElementById(id).classList.add('open')}document.getElementById('sun').addEventListener('click',toggle_m);</script></body></html>
